# fly.toml app configuration file generated for restaurant-crawler-blwmma on 2026-08-14T05:50:39Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'restaurant-crawler-blwmma'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  CRAWL_CONCURRENCY = '2'
  JOB_TIMEOUT_SECONDS = '300'
  LOG_LEVEL = 'INFO'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 512
