# fly.toml app configuration file generated for restaurant-crawler-cqfv-w on 2026-08-14T19:25:51Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'restaurant-crawler-cqfv-w'
primary_region = 'ams'
kill_timeout = '60s'

[build]
  dockerfile = 'Dockerfile'

[env]
  CRAWL_CONCURRENCY = '2'
  JOB_TIMEOUT_SECONDS = '300'
  LOG_LEVEL = 'INFO'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  checks = [{ grace_period = '20s', interval = '30s', method = 'GET', path = '/health', timeout = '5s' }]

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 512
