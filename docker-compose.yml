services:
  crawler:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/srv/app
      - ./tests:/srv/tests
      - ./fixtures:/srv/fixtures
      - ./pytest.ini:/srv/pytest.ini
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --reload